name: CI Tests & Allure Report

on:
  push:
    branches: [ "main", "feature/*" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Скачиваем зависимости заранее, чтобы AspectJ точно был в кэше
      - name: Download Dependencies
        run: mvn dependency:resolve-plugins dependency:resolve

      # 2. ЗАПУСК ТЕСТОВ
      # ВАЖНО: Здесь НЕТ continue-on-error. Если тесты падают, шаг падает -> билд красный.
      - name: Run Tests
        run: mvn test
        env:
          # Подключаем агент AspectJ через переменную окружения
          MAVEN_OPTS: "-javaagent:/home/runner/.m2/repository/org/aspectj/aspectjweaver/1.9.21/aspectjweaver-1.9.21.jar"

      # 3. ГЕНЕРАЦИЯ ОТЧЕТА
      # Если тесты упали, но результаты (allure-results) есть, отчет сгенерируется.
      # continue-on-error: true здесь нужен как страховка, если сам плагин allure:report вдруг упадет.
      - name: Generate Allure Report
        run: mvn allure:report
        continue-on-error: true

      # 4. ЗАГРУЗКА АРТЕФАКТА
      # if: always() гарантирует, что этот шаг запустится, даже если предыдущие шаги были красными.
      - name: Upload Allure Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 7
