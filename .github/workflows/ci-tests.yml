name: CI Tests & Allure Report

on:
  push:
    branches: [ "main", "feature/*" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Dependencies
        run: mvn dependency:resolve-plugins dependency:resolve -B

      # ВАЖНО: НЕТ continue-on-error. Если тесты падают — билд красный.
      - name: Run Tests
        run: mvn test -B

      # Генерация отчёта: continue-on-error: true, чтобы шаг не прерывал пайплайн
      - name: Generate Allure Report
        run: mvn allure:report -B
        continue-on-error: true

      # Диагностика: смотрим, что реально есть на диске
      - name: Debug Check Allure folders
        run: |
          echo "=== allure-results ==="
          if [ -d "target/allure-results" ]; then
            ls -la target/allure-results
            echo "Files in allure-results: $(find target/allure-results -type f | wc -l)"
          else
            echo "target/allure-results does not exist"
          fi

          echo "=== allure-maven-plugin ==="
          if [ -d "target/site/allure-maven-plugin" ]; then
            ls -la target/site/allure-maven-plugin
            echo "Files in allure-maven-plugin: $(find target/site/allure-maven-plugin -type f | wc -l)"
          else
            echo "target/site/allure-maven-plugin does not exist"
          fi

      # Загрузка артефакта: всегда, путь строго как в pom.xml
      - name: Upload Allure Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 7