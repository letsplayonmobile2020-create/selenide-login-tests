name: CI Tests & Allure Report (Artifact Only)

on:
  push:
    branches: [ "feature/allure-ci-report" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      # ВАЖНО: continue-on-error: true гарантирует, что шаг не остановит пайплайн, если тесты упадут
      - name: Run Tests & Generate Allure Results
        run: mvn test
        continue-on-error: true

      - name: Generate Allure Report
        run: mvn allure:report
        continue-on-error: true

      # ЭТОТ ШАГ: Сохраняет папку с отчетом, чтобы его скачать
      - name: Upload Allure Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 7
