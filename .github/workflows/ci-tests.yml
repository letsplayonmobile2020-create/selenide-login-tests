name: CI Tests & Allure Report

on:
  push:
    branches: [ "main", "feature/*" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Кэш оставляем, но используем его правильно

      # ШАГ 1: Принудительно скачиваем все зависимости
      # Это гарантирует, что aspectjweaver будет скачан и проверен на целостность
      - name: Download Dependencies
        run: mvn dependency:resolve-plugins dependency:resolve -B

      # ШАГ 2: Запуск тестов
      # MAVEN_OPTS УДАЛЕН! Агент теперь берется из pom.xml
      - name: Run Tests
        run: mvn test -B

      # ШАГ 3: Генерация отчета
      - name: Generate Allure Report
        run: mvn allure:report -B
        continue-on-error: true

      # ШАГ 4: Загрузка артефакта (всегда)
      - name: Upload Allure Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 7
